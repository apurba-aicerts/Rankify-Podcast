services:
  postgres:
    image: postgres:16
    container_name: rankify-podcast-db
    environment:
      POSTGRES_USER: rankify
      POSTGRES_PASSWORD: rankify
      POSTGRES_DB: rankify_podcast
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankify -d rankify_podcast"]
      interval: 10s
      timeout: 5s
      retries: 5

  podcast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rankify-podcast-api
    ports:
      - "9800:9800"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rankify:rankify@postgres:5432/rankify_podcast
    volumes:
      - ./outputs:/app/outputs
      - ./voice_samples:/app/voice_samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:

# Usage:
# docker compose up -d --build
# API: http://localhost:9800/docs
