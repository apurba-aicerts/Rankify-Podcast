version: '3.8'

services:
  podcast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rankify-podcast-api
    ports:
      - "9800:9800"
    env_file:
      - .env
    volumes:
      # Persist generated audio files outside container
      - ./outputs:/app/outputs
      # Mount voice samples (read-only)
      - ./audio/assets/voice_samples:/app/audio/assets/voice_samples:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Usage:
# docker compose up -d --build
# API available at: http://localhost:9800
# Swagger docs at: http://localhost:9800/docs
